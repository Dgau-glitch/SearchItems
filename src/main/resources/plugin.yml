name: SearchItems
version: '${version}'
main: ru.fatumsoft.searchItems.SearchItems
api-version: '1.21'
authors: [ Dgau2 ]

commands:
  searchitems:
    description: Поиск предметов в хранилищах и перезагрузка конфига
    usage: /searchitems reload | /searchitems <радиус_блоков> <item1,item2,...> [loaded|generated]

permissions:
  searchitems.command.search:
    description: Доступ к команде поиска предметов
    default: op
  searchitems.command.reload:
    description: Доступ к перезагрузке конфига SearchItems
    default: op
